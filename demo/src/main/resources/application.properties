# Web Server
server.port=${PORT:9091}
server.address=0.0.0.0
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Database Configuration
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JWT Configuration
jwt.secret=${JWT_SECRET:8f4c2e6b9a1d3f5e7c8a0b2d4e6f8a9c1b3d5f7a9c0e2b4d6f8a0c2e4d6b8f0a}
jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# CORS settings
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,https://net-shield-gules.vercel.app}
